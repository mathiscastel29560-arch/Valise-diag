# Profil véhicule — À ADAPTER pour votre véhicule avant toute utilisation réelle.
#
# Les identifiants (tx_header, rx_header, did, control_parameter...) sont
# spécifiques au constructeur et à l'ECU. Ne les inventez pas : récupérez-les
# depuis une documentation que vous détenez légitimement (manuel d'atelier
# constructeur, base de données technique officielle, export réalisé avec un
# outil de diagnostic professionnel sur VOTRE véhicule). Ce projet ne fournit
# volontairement aucune base de données propriétaire ni aucun algorithme de
# déverrouillage de sécurité ECU (SecurityAccess).
#
# Copiez ce fichier vers config/vehicle_profile.yaml puis modifiez-le.

make: "Exemple"
model: "Exemple"
year: 2015

ecus:
  # --- Interface OBD2 (ELM327/CAN) --- véhicules récents, tous constructeurs.
  - name: "moteur_can"
    protocol: "uds_can"
    tx_header: "7E0"   # adresse CAN d'émission vers l'ECU moteur (exemple ISO 15765-4 11 bits)
    rx_header: "7E8"   # adresse CAN de réponse de l'ECU moteur

    actuators:
      - name: "electrovanne_epurateur"
        description: "Électrovanne de purge canister (EXEMPLE — did fictif, à remplacer)"
        did: "F1A0"              # Data Identifier (hex) — À REMPLACER par la vraie valeur
        control_parameter: 0x03  # 0x03 = shortTermAdjustment (UDS 0x2F)
        on_state: "01"
        off_state: "00"
        max_duration_s: 2.0
        requires_engine_off: true
        requires_stationary: true

    parameters:
      - name: "avance_allumage"
        description: "Avance à l'allumage (EXEMPLE — did fictif, laissé en lecture seule)"
        did: "F40A"
        writable: false   # ne passez à true qu'après avoir validé le DID, le format et les bornes
        data_format: "int8"
        scale: 1.0
        offset: 0.0
        unit: "°"
        min_value: -10
        max_value: 40
        requires_engine_off: false
        requires_stationary: true

  # --- Interface KKL (câble K-line type VAG-COM 409.1) --- ECU VAG ~2000-2006,
  # protocole KWP2000 : mêmes notions (DID -> "identifiant local" 1 octet) que
  # ci-dessus mais sur K-line. tx_header est ici l'adresse d'initialisation
  # 5-baud de l'ECU (ex. 0x01 pour le calculateur moteur sur beaucoup de VAG).
  - name: "moteur_kwp2000"
    protocol: "kwp2000_kline"
    tx_header: "01"

    actuators:
      - name: "electrovanne_epurateur_kkl"
        description: "EXEMPLE — identifiant local fictif, à remplacer"
        did: "12"                # identifiant local (1 octet) — À REMPLACER
        control_parameter: 0x03
        on_state: "01"
        off_state: "00"
        max_duration_s: 2.0
        requires_engine_off: true
        requires_stationary: true

    parameters:
      - name: "avance_allumage_kkl"
        description: "EXEMPLE — identifiant local fictif, laissé en lecture seule"
        did: "13"
        writable: false
        data_format: "int8"
        scale: 1.0
        offset: 0.0
        unit: "°"
        requires_engine_off: false
        requires_stationary: true

  # --- Interface KKL, ECU VAG plus anciens (pré-2000/2004) --- protocole
  # KW1281 : échanges par blocs numérotés plutôt que par identifiant. Les
  # numéros de bloc ci-dessous sont des EXEMPLES : confirmez-les avec une
  # documentation que vous détenez légitimement avant de vous en servir
  # (voir docs/SECURITE.md et l'onglet Programmation > Doc rapide).
  - name: "moteur_kw1281"
    protocol: "kw1281"
    tx_header: "01"
    blocks:
      read_fault_codes: "07"   # EXEMPLE — à confirmer pour votre ECU
      clear_fault_codes: "05"  # EXEMPLE — à confirmer pour votre ECU
