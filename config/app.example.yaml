# Copiez ce fichier vers config/app.yaml puis adaptez-le.
#
# Vous avez deux lecteurs : basculez entre eux avec `interface`, ou avec
# `--interface obd2` / `--interface kkl` en ligne de commande (utile pour
# passer de l'un à l'autre sans modifier le fichier). Le menu Paramètres
# permet aussi de changer ce réglage (effectif au prochain démarrage).

interface: "obd2"            # "obd2" = ELM327/CAN générique | "kkl" = câble K-line type VAG-COM 409.1
port: "/dev/ttyUSB0"          # ou /dev/serial0 pour un adaptateur relié au GPIO UART
baudrate: 38400                # baud ELM327 (interface obd2) ou baud K-line post-init (interface kkl, souvent 9600 ou 10400)
max_speed_kmh: 0               # tests actionneurs / écritures refusés au-dessus de cette vitesse
require_confirmation: true     # demande une confirmation explicite avant toute action sensible
simulate: false
vehicle_profile_path: "config/vehicle_profile.yaml"

# --- Apparence / performance ---
# Sur un Raspberry Pi Zero premier du nom (mono-cœur), passez boot_rapide à
# true et veille_type à "citations" (beaucoup plus léger que "matrix") pour
# rester fluide. scripts/deploy_pi.sh le fait automatiquement s'il détecte
# un Pi mono-cœur.
titre_menu: "VALISE DIAG"
boot_rapide: false           # true = écran de démarrage très court
veille_active: true
veille_delai: 60             # secondes d'inactivité avant l'écran de veille
veille_type: "aleatoire"     # "matrix" | "citations" (léger) | "glitch" | "aleatoire"
police: "defaut"             # "defaut" | "petit" | "moyen" | "grand"
autostart: true
pin_active: false
