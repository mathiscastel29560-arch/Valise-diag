[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valise-diag"
version = "0.1.0"
description = "Valise de diagnostic OBD/UDS pour Raspberry Pi"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "obd>=0.7.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
