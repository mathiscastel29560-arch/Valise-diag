# Connexion automatique sur la console physique (tty1) au démarrage du Pi,
# pour un usage "valise" au démarrage automatique — le menu apparaît sans
# avoir à se connecter au clavier.
#
# Installation :
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
#   sudo cp systemd/getty-autologin-tty1.conf /etc/systemd/system/getty@tty1.service.d/override.conf
#   sudo systemctl daemon-reload
#
# Puis ajoutez le contenu de systemd/autostart.bashrc.snippet à la fin du
# ~/.bashrc de l'utilisateur concerné (voir README, section "Démarrage
# automatique") : c'est ce script, lancé à la connexion sur tty1, qui démarre
# réellement le menu. Le réglage "Démarrage automatique" de l'onglet
# Paramètres agit sur ce mécanisme (il crée/supprime ~/.autostart_disabled).

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
